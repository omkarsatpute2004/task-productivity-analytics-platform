version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: task_productivity_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_productivity
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_productivity_backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/task_productivity
      JWT_SECRET_KEY: dev_secret_key_change_in_production_1234567890_super_secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_productivity_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata_vol:
